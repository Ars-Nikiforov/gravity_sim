[package]
name = "grav_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
# egui 0.37: default_fonts больше не включён по умолчанию — включаем явно,
# иначе при загрузке системы не будет гарантированного фонта с кириллицей.
# Рендереры: wgpu (по умолчанию в 0.37) и glow (OpenGL) как запасной —
# нужен, если wgpu не находит адаптер, способный выводить в окно.
eframe = { version = "0.37", features = ["glow"] }
egui = { version = "0.37", features = ["default_fonts"] }
# Зарезервировано на будущее (параллельный Barnes-Hut, сохранение сценариев):
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"